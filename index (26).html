<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mebel POS</title>
<style>
:root{--bg:#eef1f0;--c:#fff;--t:#1b2523;--m:#6b7774;--p:#1f4d45;--pt:#fff;--a:#b9782f;--b:#d9dfdd;--r:#b3402f}
@media(prefers-color-scheme:dark){:root{--bg:#141a19;--c:#1d2524;--t:#e8eeec;--m:#92a09c;--p:#5fb3a2;--pt:#0d1514;--a:#e0a05a;--b:#2e3a38;--r:#ef7a68}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--t);display:flex;min-height:100vh}
nav{width:176px;background:var(--c);border-right:1px solid var(--b);padding:14px 10px;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:16px;margin:0 6px 14px;color:var(--p)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--t);padding:9px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav button.on{background:var(--p);color:var(--pt)}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 8px;font-size:15px}
.card{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:14px;margin-bottom:14px}
.g2{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.k{background:var(--c);border:1px solid var(--b);border-radius:8px;padding:12px}.k small{color:var(--m)}.k b{display:block;font-size:19px;margin-top:2px}
input,select{font:inherit;padding:8px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:120px}
button.b{background:var(--p);color:var(--pt);border:0;border-radius:6px;padding:9px 14px;font:inherit;cursor:pointer}button.b.o{background:none;color:var(--p);border:1px solid var(--p)}button.b.x{background:none;color:var(--r);border:1px solid var(--r);padding:4px 8px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th,td{padding:7px 6px;border-bottom:1px solid var(--b);text-align:left;white-space:nowrap}th{color:var(--m);font-weight:500}td input{padding:5px;min-width:70px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:10px;max-height:60vh;overflow:auto}
.pb{background:var(--bg);border:1px solid var(--b);border-radius:6px;padding:8px;text-align:left;color:var(--t);font:inherit;cursor:pointer}.pb:disabled{opacity:.4}.pb:hover:not(:disabled){border-color:var(--p)}
.m{color:var(--m)}.low{color:var(--r);font-weight:600}.tot{font-size:20px;font-weight:700;color:var(--p)}.right{text-align:right}
.bars{display:flex;gap:10px;align-items:flex-end;height:120px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--m)}.bars i{display:block;background:var(--a);border-radius:3px 3px 0 0;min-height:2px}
#toast{position:fixed;bottom:14px;right:14px;background:var(--p);color:var(--pt);padding:8px 14px;border-radius:6px;display:none}
@media(max-width:760px){body{display:block}nav{width:auto;height:auto;position:sticky;z-index:5;display:flex;overflow-x:auto;padding:8px;border-right:0;border-bottom:1px solid var(--b)}nav h1{display:none}nav button{width:auto;white-space:nowrap}.g2{grid-template-columns:1fr}main{padding:12px}}
</style></head><body>
<nav><h1>Mebel POS</h1></nav><main id="v"></main><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5),today=()=>new Date().toISOString().slice(0,10),
E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
let S=JSON.parse(localStorage.getItem('set')||'{"nama":"Toko Mebel Saya","alamat":"","url":""}'),
DB=JSON.parse(localStorage.getItem('db')||'null')||{Produk:[],Penjualan:[],Pembelian:[],Pengeluaran:[]},
C=[],K={pelanggan:'',diskon:0,metode:'Tunai',bayar:0},B=[],V={supplier:''},Q='',D1=today().slice(0,8)+'01',D2=today(),cur='dash';
function st(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2500)}
async function sync(sh){localStorage.setItem('db',JSON.stringify(DB));if(!S.url)return;try{await fetch(S.url,{method:'POST',body:JSON.stringify({sheet:sh,rows:DB[sh]})});st('Tersimpan ke Spreadsheet')}catch(e){st('Gagal sinkron, data aman di perangkat')}}
async function pull(){if(!S.url)return st('Isi URL di Pengaturan');try{const r=await(await fetch(S.url)).json();Object.keys(DB).forEach(k=>{if(r[k])DB[k]=r[k]});localStorage.setItem('db',JSON.stringify(DB));st('Data diambil dari Spreadsheet');go(cur)}catch(e){st('Gagal mengambil data')}}
const MENU={dash:'Dashboard',kasir:'Penjualan',beli:'Pembelian',stok:'Stok',biaya:'Pengeluaran',lap:'Laporan',set:'Pengaturan'};
const P={};
function go(p){cur=p;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==p));$('#v').innerHTML=P[p]()}
$('nav').insertAdjacentHTML('beforeend',Object.entries(MENU).map(([k,v])=>`<button data-p="${k}" onclick="go('${k}')">${v}</button>`).join(''));

// DASHBOARD
P.dash=()=>{const t=today(),bl=t.slice(0,7),J=DB.Penjualan,ym=x=>x.tgl.slice(0,7)==bl,
omzet=sum(J.filter(ym),x=>x.total),laba=sum(J.filter(ym),x=>sum(x.items,i=>(i.harga-i.modal)*i.qty)-x.diskon),
beli=sum(DB.Pembelian.filter(ym),x=>x.total),biaya=sum(DB.Pengeluaran.filter(ym),x=>x.jumlah),
hari=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{d:d.slice(5),v:sum(J.filter(x=>x.tgl==d),x=>x.total)}}),mx=Math.max(1,...hari.map(h=>h.v)),
low=DB.Produk.filter(p=>p.stok<=p.min);
return `<h2>Dashboard</h2><div class=g4><div class=k><small>Pendapatan hari ini</small><b>${R(sum(J.filter(x=>x.tgl==t),x=>x.total))}</b></div><div class=k><small>Pendapatan bulan ini</small><b>${R(omzet)}</b></div><div class=k><small>Laba bersih bulan ini</small><b>${R(laba-biaya)}</b></div><div class=k><small>Pembelian bulan ini</small><b>${R(beli)}</b></div></div>
<div class=g2><div class=card><h3>Penjualan 7 hari terakhir</h3><div class=bars>${hari.map(h=>`<div><i style="height:${h.v/mx*100}px"></i>${h.d}</div>`).join('')}</div></div>
<div class=card><h3>Stok menipis (${low.length})</h3>${low.map(p=>`<div class=row style="margin:0"><span>${E(p.nama)}</span><span class="low right">${p.stok}</span></div>`).join('')||'<p class=m>Semua stok aman.</p>'}</div></div>`};

// PENJUALAN
const add=id=>{const p=DB.Produk.find(x=>x.id==id),c=C.find(x=>x.id==id);if(c)c.qty++;else C.push({id,nama:p.nama,qty:1,harga:+p.harga_jual,modal:+p.harga_beli});go('kasir')};
const setc=(i,k,v)=>{C[i][k]=Math.max(0,+v);go('kasir')};
P.kasir=()=>{const q=Q.toLowerCase(),ps=DB.Produk.filter(p=>(p.nama+p.kode).toLowerCase().includes(q)),sub=sum(C,i=>i.qty*i.harga),tot=Math.max(sub-(+K.diskon||0),0),bayar=+K.bayar||0;
return `<h2>Penjualan</h2><div class=g2><div class=card><input placeholder="Cari nama atau kode produk" value="${E(Q)}" onchange="Q=this.value;go('kasir')"><div class=pl>${ps.map(p=>`<button class=pb ${p.stok<1?'disabled':''} onclick="add('${p.id}')"><b>${E(p.nama)}</b><br>${R(p.harga_jual)}<br><small class=m>stok ${p.stok}</small></button>`).join('')||'<p class=m>Belum ada produk. Tambahkan di menu Stok.</p>'}</div></div>
<div class=card><h3>Keranjang</h3><div class=tw><table>${C.map((i,n)=>`<tr><td>${E(i.nama)}</td><td><input type=number value=${i.qty} style="width:60px" onchange="setc(${n},'qty',this.value)"></td><td><input type=number value=${i.harga} style="width:110px" onchange="setc(${n},'harga',this.value)"></td><td class=right>${R(i.qty*i.harga)}</td><td><button class="b x" onclick="C.splice(${n},1);go('kasir')">Hapus</button></td></tr>`).join('')||'<tr><td class=m>Pilih produk di sebelah kiri.</td></tr>'}</table></div>
<div class=row style="margin-top:10px"><input placeholder="Nama pelanggan" value="${E(K.pelanggan)}" onchange="K.pelanggan=this.value"><input type=number placeholder="Diskon (Rp)" value="${K.diskon||''}" onchange="K.diskon=this.value;go('kasir')"></div>
<div class=row><select onchange="K.metode=this.value">${['Tunai','Transfer','QRIS','Kredit'].map(m=>`<option ${K.metode==m?'selected':''}>${m}</option>`).join('')}</select><input type=number placeholder="Uang diterima" value="${K.bayar||''}" onchange="K.bayar=this.value;go('kasir')"></div>
<p>Total <span class=tot>${R(tot)}</span>${bayar?`<br><span class=m>Kembalian ${R(Math.max(bayar-tot,0))}</span>`:''}</p><button class=b onclick="jual()">Simpan dan cetak nota</button></div></div>`};
function jual(){if(!C.length)return alert('Keranjang masih kosong');for(const i of C){const p=DB.Produk.find(x=>x.id==i.id);if(p.stok<i.qty)return alert('Stok '+p.nama+' tidak cukup (sisa '+p.stok+')')}
const sub=sum(C,i=>i.qty*i.harga),dk=+K.diskon||0,tot=Math.max(sub-dk,0),t={id:uid(),no:'INV-'+today().replace(/-/g,'')+'-'+String(DB.Penjualan.filter(x=>x.tgl==today()).length+1).padStart(3,'0'),tgl:today(),pelanggan:K.pelanggan||'Umum',items:C.map(i=>({...i})),diskon:dk,total:tot,metode:K.metode,bayar:+K.bayar||tot};
C.forEach(i=>DB.Produk.find(x=>x.id==i.id).stok-=i.qty);DB.Penjualan.push(t);sync('Penjualan');sync('Produk');nota(t.id);C=[];K={pelanggan:'',diskon:0,metode:'Tunai',bayar:0};go('kasir')}
function nota(id){const t=DB.Penjualan.find(x=>x.id==id),w=window.open('','_blank','width=340,height=640');if(!w)return alert('Izinkan pop-up untuk mencetak nota');
w.document.write(`<html><head><title>${t.no}</title><style>body{font:12px monospace;width:72mm;margin:6px auto}h3,p{margin:2px 0;text-align:center}table{width:100%}td:last-child{text-align:right}hr{border:0;border-top:1px dashed #000}</style></head><body><h3>${E(S.nama)}</h3><p>${E(S.alamat)}</p><hr>No: ${t.no}<br>Tgl: ${t.tgl}<br>Pelanggan: ${E(t.pelanggan)}<hr><table>${t.items.map(i=>`<tr><td colspan=2>${E(i.nama)}</td></tr><tr><td>${i.qty} x ${Math.round(i.harga).toLocaleString('id-ID')}</td><td>${Math.round(i.qty*i.harga).toLocaleString('id-ID')}</td></tr>`).join('')}</table><hr><table><tr><td>Diskon</td><td>${Math.round(t.diskon).toLocaleString('id-ID')}</td></tr><tr><td><b>Total</b></td><td><b>${Math.round(t.total).toLocaleString('id-ID')}</b></td></tr><tr><td>${t.metode}</td><td>${Math.round(t.bayar).toLocaleString('id-ID')}</td></tr><tr><td>Kembali</td><td>${Math.round(Math.max(t.bayar-t.total,0)).toLocaleString('id-ID')}</td></tr></table><hr><p>Terima kasih atas kunjungan Anda</p><script>onload=()=>{print()}<\/script></body></html>`);w.document.close()}

// PEMBELIAN
const addB=id=>{if(!id)return;const p=DB.Produk.find(x=>x.id==id);if(!B.find(x=>x.id==id))B.push({id,nama:p.nama,qty:1,harga:+p.harga_beli});go('beli')};
P.beli=()=>`<h2>Pembelian dari Supplier</h2><div class=card><div class=row><input placeholder="Nama supplier" value="${E(V.supplier)}" onchange="V.supplier=this.value"><select onchange="addB(this.value)"><option value="">+ Tambah produk</option>${DB.Produk.map(p=>`<option value="${p.id}">${E(p.nama)}</option>`).join('')}</select></div>
<div class=tw><table><tr><th>Produk<th>Jumlah<th>Harga beli<th class=right>Subtotal<th></tr>${B.map((i,n)=>`<tr><td>${E(i.nama)}<td><input type=number value=${i.qty} style="width:70px" onchange="B[${n}].qty=+this.value;go('beli')"><td><input type=number value=${i.harga} style="width:120px" onchange="B[${n}].harga=+this.value;go('beli')"><td class=right>${R(i.qty*i.harga)}<td><button class="b x" onclick="B.splice(${n},1);go('beli')">Hapus</button></tr>`).join('')}</table></div>
<p>Total <span class=tot>${R(sum(B,i=>i.qty*i.harga))}</span></p><button class=b onclick="beli()">Simpan dan tambah stok</button></div>
<div class=card><h3>Riwayat pembelian</h3><div class=tw><table>${DB.Pembelian.slice().reverse().slice(0,30).map(x=>`<tr><td>${x.tgl}<td>${E(x.supplier)}<td>${x.items.map(i=>E(i.nama)+' ×'+i.qty).join(', ')}<td class=right>${R(x.total)}</tr>`).join('')}</table></div></div>`;
function beli(){if(!B.length)return alert('Pilih produk terlebih dahulu');B.forEach(i=>{const p=DB.Produk.find(x=>x.id==i.id);p.stok=+p.stok+i.qty;p.harga_beli=i.harga});
DB.Pembelian.push({id:uid(),tgl:today(),supplier:V.supplier||'-',items:B.map(i=>({...i})),total:sum(B,i=>i.qty*i.harga)});sync('Pembelian');sync('Produk');B=[];V={supplier:''};st('Stok bertambah');go('beli')}

// STOK
P.stok=()=>`<h2>Stok Barang</h2><div class=card><h3>Tambah produk</h3><div class=row><input id=pk placeholder="Kode (mis. SF-01)"><input id=pn placeholder="Nama produk"><input id=pc placeholder="Kategori (sofa, lemari...)"></div><div class=row><input id=pb type=number placeholder="Harga beli"><input id=pj type=number placeholder="Harga jual"><input id=ps type=number placeholder="Stok awal"><input id=pm type=number placeholder="Batas stok minimum"></div><button class=b onclick="addP()">Simpan produk</button></div>
<div class=card><div class=tw><table><tr><th>Kode<th>Nama<th>Kategori<th>Beli<th>Jual<th>Stok<th></tr>${DB.Produk.map(p=>`<tr><td>${E(p.kode)}<td>${E(p.nama)}<td>${E(p.kategori)}<td>${R(p.harga_beli)}<td>${R(p.harga_jual)}<td class="${p.stok<=p.min?'low':''}">${p.stok}<td><button class="b o" onclick="opname('${p.id}')">Opname</button> <button class="b o" onclick="editP('${p.id}')">Ubah</button> <button class="b x" onclick="delP('${p.id}')">Hapus</button></tr>`).join('')||'<tr><td class=m>Belum ada produk.</tr>'}</table></div></div>`;
function addP(){const g=i=>$('#'+i).value.trim();if(!g('pn'))return alert('Nama produk wajib diisi');DB.Produk.push({id:uid(),kode:g('pk'),nama:g('pn'),kategori:g('pc'),harga_beli:+g('pb')||0,harga_jual:+g('pj')||0,stok:+g('ps')||0,min:+g('pm')||0});sync('Produk');go('stok')}
function opname(id){const p=DB.Produk.find(x=>x.id==id),v=prompt('Stok fisik "'+p.nama+'" (tercatat '+p.stok+'):',p.stok);if(v===null||v==='')return;p.stok=+v;sync('Produk');go('stok')}
function editP(id){const p=DB.Produk.find(x=>x.id==id),n=prompt('Nama',p.nama),j=prompt('Harga jual',p.harga_jual),b=prompt('Harga beli',p.harga_beli);if(n)p.nama=n;if(j)p.harga_jual=+j;if(b)p.harga_beli=+b;sync('Produk');go('stok')}
function delP(id){if(confirm('Hapus produk ini?')){DB.Produk=DB.Produk.filter(x=>x.id!=id);sync('Produk');go('stok')}}

// PENGELUARAN
P.biaya=()=>`<h2>Pengeluaran Operasional</h2><div class=card><div class=row><input id=bk placeholder="Keterangan (listrik, gaji, ongkir...)"><input id=bj type=number placeholder="Jumlah (Rp)"><button class=b onclick="addX()" style="flex:none">Simpan</button></div></div><div class=card><div class=tw><table>${DB.Pengeluaran.slice().reverse().map(x=>`<tr><td>${x.tgl}<td>${E(x.ket)}<td class=right>${R(x.jumlah)}<td><button class="b x" onclick="delX('${x.id}')">Hapus</button></tr>`).join('')||'<tr><td class=m>Belum ada pengeluaran.</tr>'}</table></div></div>`;
function addX(){const j=+$('#bj').value;if(!j)return alert('Isi jumlah');DB.Pengeluaran.push({id:uid(),tgl:today(),ket:$('#bk').value,jumlah:j});sync('Pengeluaran');go('biaya')}
function delX(id){DB.Pengeluaran=DB.Pengeluaran.filter(x=>x.id!=id);sync('Pengeluaran');go('biaya')}

// LAPORAN
P.lap=()=>{const f=x=>x.tgl>=D1&&x.tgl<=D2,J=DB.Penjualan.filter(f),om=sum(J,x=>x.total),lk=sum(J,x=>sum(x.items,i=>(i.harga-i.modal)*i.qty)-x.diskon),bl=sum(DB.Pembelian.filter(f),x=>x.total),bx=sum(DB.Pengeluaran.filter(f),x=>x.jumlah);
return `<h2>Laporan Pendapatan</h2><div class=card><div class=row><input type=date value=${D1} onchange="D1=this.value;go('lap')"><input type=date value=${D2} onchange="D2=this.value;go('lap')"></div></div>
<div class=g4><div class=k><small>Pendapatan (omzet)</small><b>${R(om)}</b></div><div class=k><small>Laba kotor</small><b>${R(lk)}</b></div><div class=k><small>Pengeluaran</small><b>${R(bx)}</b></div><div class=k><small>Laba bersih</small><b>${R(lk-bx)}</b></div><div class=k><small>Pembelian stok</small><b>${R(bl)}</b></div></div>
<div class=card><h3>Transaksi penjualan</h3><div class=tw><table><tr><th>No<th>Tanggal<th>Pelanggan<th>Bayar<th class=right>Total<th></tr>${J.slice().reverse().map(x=>`<tr><td>${x.no}<td>${x.tgl}<td>${E(x.pelanggan)}<td>${x.metode}<td class=right>${R(x.total)}<td><button class="b o" onclick="nota('${x.id}')">Cetak ulang</button></tr>`).join('')||'<tr><td class=m>Tidak ada transaksi pada periode ini.</tr>'}</table></div></div>`};

// PENGATURAN
P.set=()=>`<h2>Pengaturan</h2><div class=card><div class=row><input id=sn placeholder="Nama toko" value="${E(S.nama)}"><input id=sa placeholder="Alamat / telepon" value="${E(S.alamat)}"></div><div class=row><input id=su placeholder="URL Web App Google Apps Script" value="${E(S.url)}"></div>
<div class=row><button class=b onclick="saveS()">Simpan pengaturan</button><button class="b o" onclick="pull()">Ambil data dari Spreadsheet</button><button class="b o" onclick="Object.keys(DB).forEach(sync)">Kirim semua data ke Spreadsheet</button></div>
<p class=m>Tanpa URL, data tersimpan di browser perangkat ini saja. Dengan URL, setiap transaksi otomatis masuk ke Google Sheets.</p></div>`;
function saveS(){S={nama:$('#sn').value,alamat:$('#sa').value,url:$('#su').value.trim()};localStorage.setItem('set',JSON.stringify(S));st('Pengaturan tersimpan');if(S.url)pull()}
pull().finally(()=>go('dash'));go('dash');
</script></body></html>
