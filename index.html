<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mebel POS Premium</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<div class="sidebar-overlay" id="overlay" onclick="closeSidebar()"></div><aside class="sidebar" id="sidebar">
  <div class="brand" id="brandArea"></div>
  <div>
    <div class="nav-label">MENU UTAMA</div>
    <nav class="nav" id="navMain"></nav>
  </div>
  <div class="side-bottom">
    <div style="font-weight:650;margin-bottom:4px" id="sideName">MEBEL POS</div>
    <small id="sideTag">Premium furniture POS</small>
    <div style="margin-top:12px;font-size:10px;color:#8f9da1">Versi 2.0 Premium</div>
  </div>
</aside>
<main class="main">
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:11px">
      <button class="hamb" onclick="openSidebar()">☰</button>
      <div>
        <div class="eyebrow" id="eyebrow">MEBEL POS / POINT OF SALE</div>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
    </div>
    <div class="top-actions">
      <div class="date-chip" id="todayChip">◷ Hari ini</div>
      <div class="profile"><div class="avatar" id="topAvatar">A</div><span style="font-size:11px;font-weight:650" id="topName">Admin</span></div>
    </div>
  </header>
  <div id="view"></div>
</main>
</div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-card"><div style="font-size:38px;color:#32856c">✓</div><div class="eyebrow">TRANSAKSI BERHASIL</div><h2>Pembayaran diterima!</h2><p id="receiptText"></p><div class="modal-actions"><button class="secondary" onclick="closeModal()">Tutup</button><button class="primary" onclick="printReceipt()">Cetak Struk</button></div></div></div>

<script src="js/app.js"></script>

<div class="login-overlay" id="loginOverlay" style="display:none">
  <div class="login-card">
    <div class="eyebrow">MEBEL POS</div>
    <h2>Masuk ke Sistem</h2>
    <input id="loginUser" placeholder="Username" autocomplete="username">
    <input id="loginPass" type="password" placeholder="Password" autocomplete="current-password">
    <div class="login-error" id="loginError"></div>
    <button onclick="doLogin()">Masuk</button>
    <p style="font-size:11px;color:var(--muted);margin-top:16px">Default: pemilik/pemilik123 · kasir/kasir123 · gudang/gudang123</p>
  </div>
</div>
</body>
</html>
