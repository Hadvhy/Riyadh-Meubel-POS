<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riyadh Meubel POS</title>
<script src="config.js" onerror="void 0"></script>
<style>
:root{--navy:#c1121f;--navy2:#e63946;--wood:#986b46;--gold:#d5ad72;--cream:#f6f2eb;--paper:#fffdf9;--ink:#263238;--muted:#879096;--line:#e9e3da;--green:#32856c;--red:#c75c50;--shadow:0 12px 35px #182b3510}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
.app{min-height:100vh;display:grid;grid-template-columns:246px 1fr}
.sidebar{background:linear-gradient(180deg,#9e1b25 0%,#82161f 100%);color:#fff;padding:26px 17px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:42px;height:42px;border:1px solid #b99567;border-radius:13px;display:grid;place-items:center;color:var(--gold);font-size:22px;overflow:hidden;background:#ffffff10}
.brand-mark img{width:100%;height:100%;object-fit:cover}
.brand strong{display:block;letter-spacing:1.2px;font-size:15.5px;font-weight:800;color:#fff}
.brand small{color:#ffe3c2;font-size:11px;letter-spacing:1.4px;font-weight:500}
.nav-label{font-size:11px;font-weight:700;color:#ffd9a8;letter-spacing:1.7px;padding:0 12px;margin-bottom:8px}
.nav{display:grid;gap:5px}
.nav button{color:#fff;font-size:14.5px;font-weight:600;background:transparent;text-align:left;padding:12px;border-radius:10px;display:flex;gap:12px;align-items:center;transition:background .15s}
.nav button:hover{background:#ffffff22;color:#fff}
.nav button.active{background:#ffffff2e;color:#fff;font-weight:700}
.nav button.active{box-shadow:inset 4px 0 #ffd28a}
.nav .ico{width:22px;text-align:center;font-size:18px}
.side-bottom{margin-top:auto;background:#ffffff1a;border:1px solid #ffffff2e;border-radius:13px;padding:14px;color:#fff;font-weight:600}
.side-bottom small{color:#ffe3c2;font-weight:500;font-size:12px}
.main{min-width:0;padding:27px 30px 35px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:25px}
.eyebrow{color:var(--wood);font-size:10px;letter-spacing:2px;font-weight:700}
.topbar h1{font-size:25px;margin:4px 0 0;letter-spacing:-.7px}
.top-actions{display:flex;align-items:center;gap:10px}
.date-chip,.profile{background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:10px 13px;color:#59646a}
.profile{display:flex;align-items:center;gap:9px}
.avatar{width:30px;height:30px;background:#e8d9c6;color:#68482d;border-radius:50%;display:grid;place-items:center;font-weight:700;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:23px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}
.stat-top{display:flex;justify-content:space-between;color:var(--muted);font-size:11px}
.stat-icon{width:30px;height:30px;border-radius:9px;background:#f1e8dc;color:var(--wood);display:grid;place-items:center}
.stat strong{font-size:21px;display:block;margin:8px 0 1px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px}
.section-head h2{font-size:16px;margin:0}
.toolbar{display:flex;gap:10px;margin-bottom:13px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:200px}
.search input{width:100%;height:42px;border:1px solid var(--line);border-radius:10px;background:var(--paper);padding:0 14px 0 39px;outline:none}
.search:before{content:"⌕";position:absolute;left:14px;top:7px;font-size:22px;color:#9ba1a3}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 14px}
.chip{white-space:nowrap;background:transparent;border:1px solid var(--line);color:#687278;border-radius:30px;padding:7px 13px;font-size:11px}
.chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:13px}
.product{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s;cursor:pointer}
.product:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#d2b58e}
.product-art{height:110px;display:grid;place-items:center;position:relative;background:linear-gradient(135deg,#e8dfd2,#f4eee5);font-size:48px}
.product-art small{position:absolute;left:10px;top:10px;background:#ffffffd9;color:#6f604f;padding:4px 7px;border-radius:5px;font-size:9px}
.product-info{padding:12px}
.product-info h3{font-size:13px;margin:0 0 4px}
.product-info p{font-size:10px;color:var(--muted);margin:0 0 10px}
.product-bottom{display:flex;justify-content:space-between;align-items:center}
.price{font-size:13px;font-weight:750;color:#65472f}
.add{width:27px;height:27px;border-radius:8px;background:var(--navy);color:#fff;font-size:18px;line-height:1}
.stock{font-size:9px;color:#829087}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:22px;align-items:start}
.cart{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);position:sticky;top:18px;overflow:hidden}
.cart-head{padding:18px 18px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.cart-head h2{margin:0;font-size:16px}
.clear{background:none;color:var(--red);font-size:11px}
.customer{padding:13px 18px;border-bottom:1px solid var(--line)}
.customer label,.field label{display:block;font-size:10px;color:var(--muted);margin-bottom:6px}
.customer input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff;outline:none;font-size:12px}
.cart-items{padding:8px 18px;max-height:280px;overflow:auto;min-height:110px}
.empty{text-align:center;color:#9aa1a4;padding:35px 5px;font-size:12px}
.cart-item{display:grid;grid-template-columns:40px 1fr auto;gap:9px;padding:10px 0;border-bottom:1px solid #f0ece6;align-items:center}
.cart-thumb{height:40px;border-radius:9px;background:#eee5d9;display:grid;place-items:center;font-size:21px}
.item-name{font-size:11px;font-weight:650}
.item-price{font-size:10px;color:var(--wood);margin-top:3px}
.qty{display:flex;align-items:center;gap:7px;margin-top:5px}
.qty button{width:19px;height:19px;border-radius:5px;background:#f0ece6;color:#455158}
.line-total{font-size:11px;font-weight:700;white-space:nowrap}
.summary{padding:14px 18px;border-top:1px solid var(--line)}
.sum-row{display:flex;justify-content:space-between;margin:7px 0;color:#788187;font-size:11px}
.sum-row.total{border-top:1px dashed #ddd4c8;padding-top:12px;margin-top:12px;color:var(--ink);font-weight:750;font-size:14px}
.sum-row.total strong{font-size:19px;color:#68482d}
.discount-row{display:flex;gap:7px;margin:12px 0}
.discount-row input{width:100%;min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:11px}
.pay{padding:0 18px 18px}
.pay label{display:block;font-size:10px;color:var(--muted);margin-bottom:7px}
.pay select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;margin-bottom:11px}
.checkout{width:100%;background:var(--navy);color:#fff;border-radius:10px;padding:13px;font-weight:700;letter-spacing:.2px}
.checkout:hover{background:#29434d}
.checkout:disabled{opacity:.45;cursor:not-allowed}
.btn{background:var(--navy);color:#fff;border-radius:9px;padding:10px 16px;font-weight:600}
.btn.o{background:none;color:var(--navy);border:1px solid var(--navy)}
.btn.x{background:none;color:var(--red);border:1px solid var(--red);padding:4px 10px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.row>*{flex:1;min-width:140px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20343d;color:#fff;padding:11px 18px;border-radius:10px;box-shadow:var(--shadow);display:none;z-index:50}
.modal{display:none;position:fixed;inset:0;background:#101b20a8;z-index:100;place-items:center;padding:20px}
.modal.show{display:grid}
.modal-card{width:min(420px,100%);background:var(--paper);border-radius:16px;padding:24px;text-align:center}
.modal-actions{display:flex;gap:9px;margin-top:20px}
.modal-actions button{flex:1;padding:11px;border-radius:9px}
.secondary{background:#eee8df;color:#5c5145}
.primary{background:var(--navy);color:white}
.hamb{display:none;background:var(--navy);color:#fff;border-radius:8px;padding:8px 11px}
.logo-preview{width:80px;height:80px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#f9f6f1}
.logo-preview img{max-width:100%;max-height:100%;object-fit:contain}
.role-badge{display:inline-block;background:var(--wood);color:#fff;padding:2px 8px;border-radius:6px;font-size:10px;margin-left:6px}

/* Login Screen Styles */
.login-screen{position:fixed;inset:0;background:#f4f6f8;display:flex;align-items:center;justify-content:center;z-index:300;padding:20px}
.login-container{width:min(960px,100%);background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.08);display:grid;grid-template-columns:1.1fr 1fr;min-height:560px}
.login-left{background:linear-gradient(160deg,#e63946 0%,#c1121f 50%,#a4161a 100%);color:#fff;padding:40px 36px;position:relative;display:flex;flex-direction:column;justify-content:space-between}
.login-left::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 30%,rgba(255,255,255,.12),transparent 40%),radial-gradient(circle at 80% 70%,rgba(255,255,255,.08),transparent 35%);pointer-events:none}
.brand-top{display:flex;align-items:center;gap:10px;z-index:1}
.brand-top img{width:48px;height:48px;border-radius:12px;object-fit:cover;background:#fff}
.brand-top strong{font-size:18px;letter-spacing:.3px}
.brand-top span{font-size:11px;opacity:.85;display:block;margin-top:1px}
.phone-wrap{display:flex;justify-content:center;align-items:center;flex:1;z-index:1;position:relative}
.phone{width:180px;height:360px;background:#111;border-radius:28px;padding:10px;box-shadow:0 20px 40px rgba(0,0,0,.35);position:relative}
.phone-screen{background:#fff;height:100%;border-radius:20px;overflow:hidden;color:#333;font-size:11px}
.phone-header{background:#e63946;color:#fff;padding:8px 10px;display:flex;justify-content:space-between;align-items:center;font-size:10px}
.phone-body{padding:8px}
.phone-item{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #f0f0f0}
.phone-item strong{color:#2d6a4f}
.promo{z-index:1}
.promo h1{font-size:32px;line-height:1.15;margin-bottom:12px;font-weight:800}
.promo p{font-size:14px;opacity:.92;line-height:1.5;max-width:320px}
.badge{display:inline-block;background:#ffd60a;color:#111;padding:6px 14px;border-radius:20px;font-size:12px;font-weight:700;margin-top:16px}
.login-right{padding:48px 40px;display:flex;flex-direction:column;justify-content:center}
.login-right h2{font-size:26px;margin-bottom:6px;color:#1d1d1f}
.login-right .sub{color:#6b7280;font-size:14px;margin-bottom:28px}
.field{margin-bottom:16px;position:relative}
.field label{display:block;font-size:13px;color:#374151;margin-bottom:6px;font-weight:500}
.field input{width:100%;padding:13px 14px 13px 42px;border:1.5px solid #e5e7eb;border-radius:12px;font-size:14px;outline:none;transition:.2s}
.field input:focus{border-color:#e63946;box-shadow:0 0 0 3px rgba(230,57,70,.1)}
.field .icon{position:absolute;left:14px;top:38px;color:#9ca3af;font-size:16px}
.login-row{display:flex;justify-content:space-between;align-items:center;margin:8px 0 20px;font-size:13px}
.login-row a{color:#e63946;text-decoration:none;font-weight:500}
.remember{display:flex;align-items:center;gap:6px;color:#4b5563}
.login-btn{width:100%;background:#e63946;color:#fff;border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;transition:.2s}
.login-btn:hover{background:#c1121f}
.login-footer{margin-top:20px;text-align:center;font-size:13px;color:#6b7280}
.login-footer a{color:#e63946;font-weight:600;text-decoration:none}
.login-error{color:#e63946;font-size:13px;margin-bottom:12px;display:none}

@media(max-width:1100px){.layout{grid-template-columns:minmax(0,1fr) 320px}.products{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}.main{padding:22px 20px}}
@media(max-width:760px){
  .app{grid-template-columns:1fr}.sidebar{position:fixed;z-index:20;left:-260px;top:0;bottom:0;width:246px;transition:.25s;box-shadow:20px 0 40px #0002}.sidebar.open{left:0}.main{padding:17px 14px 28px}.topbar h1{font-size:20px}.hamb{display:block}.top-actions .date-chip{display:none}.profile span{display:none}.layout{grid-template-columns:1fr}.cart{position:static}
  .login-container{grid-template-columns:1fr}
  .login-left{min-height:240px;padding:24px 20px}
  .promo h1{font-size:24px}
  .login-right{padding:32px 24px}
  .phone{width:140px;height:280px}
}
</style>

<script>
// Standalone login - always available
window.doLogin = function(){
  try {
    var u = (document.getElementById('loginUser').value || '').trim().toLowerCase();
    var p = document.getElementById('loginPass').value || '';
    var err = document.getElementById('loginError');
    var hardUsers = [
      {username:'pemilik', password:'pemilik', nama:'Pemilik', role:'pemilik', id:'1'},
      {username:'kasir', password:'kasir', nama:'Kasir', role:'kasir', id:'2'},
      {username:'gudang', password:'gudang', nama:'Gudang', role:'gudang', id:'3'}
    ];
    var user = hardUsers.find(function(x){ return x.username === u && x.password === p; });
    if(!user){
      if(err){ err.textContent = 'Username atau password salah'; err.style.display = 'block'; }
      return;
    }
    if(err) err.style.display = 'none';
    window.CURRENT = user;
    try { sessionStorage.setItem('currentUser', JSON.stringify(user)); } catch(e){}
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'grid';
    // Delay a bit so main script functions are ready
    setTimeout(function(){
      if(typeof buildNav === 'function') buildNav();
      if(typeof updateBrand === 'function') updateBrand();
      if(typeof go === 'function'){
        var first = 'dash';
        if(typeof getAllowedMenu === 'function'){
          var m = getAllowedMenu();
          if(m && m.length) first = m[0].id;
        }
        go(first);
      }
      if(typeof toast === 'function') toast('Selamat datang, ' + user.nama);
    }, 50);
  } catch(e) {
    alert('Login error: ' + e.message);
  }
};
</script>

<script>
const $=s=>document.querySelector(s);
const R=n=>'Rp '+Math.round(+n||0).toLocaleString('id-ID');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const today=()=>new Date().toISOString().slice(0,10);
const E=function(s){s=String(s==null?"":s);var amp=String.fromCharCode(38)+"amp;",lt=String.fromCharCode(38)+"lt;",gt=String.fromCharCode(38)+"gt;",quot=String.fromCharCode(38)+"quot;",apos=String.fromCharCode(38)+"#39;";return s.replace(/&/g,amp).replace(/</g,lt).replace(/>/g,gt).replace(/"/g,quot).replace(/'/g,apos);};
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);

const DEFAULT_KATEGORI = [
  "Kursi","Meja","Lemari","Sofa","Tempat Tidur","Kasur","Rak",
  "Meja Makan","Kursi Makan","Meja Tamu","Meja Kerja","Kursi Kantor",
  "Lemari Pakaian","Lemari Buku","Nakas","Bufet","Kredens",
  "Kitchen Set","Sofa Bed","Tempat Tidur Anak","Furniture Anak",
  "Bangku","Stool","Partisi","Meja Rias","Outdoor Furniture",
  "Aksesoris","Lain-lain"
];

const CFG=Object.assign({SCRIPT_URL:'https://script.google.com/macros/s/AKfycbzHmofSPCsXWMi3Sq7ZpsVB8dscjM_ZGhSYCldNd9W4jSSLBqkzS5zI7MVYITZKTvUkZA/exec'},window.APP_CONFIG||{});
let S=JSON.parse(localStorage.getItem('set')||'{"nama":"Riyadh Meubel","alamat":"","telp":"","slogan":"Premium Furniture","logo":"https://raw.githubusercontent.com/Hadvhy/Riyadh-Meubel-POS/main/logo%20riyadh.jpeg","url":"","kategoriTambahan":[]}');
if(CFG.SCRIPT_URL)S.url=CFG.SCRIPT_URL;
let DB=JSON.parse(localStorage.getItem('db')||'null')||{Produk:[],Penjualan:[],Pembelian:[],Pengeluaran:[]};
function normItems(v){
  if(Array.isArray(v)) return v;
  if(typeof v==='string'){ try{ const p=JSON.parse(v); if(Array.isArray(p)) return p; }catch(e){} }
  return [];
}
function normTgl(v){
  if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}T/.test(v)){
    const d=new Date(v);
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  return v;
}
function normDB(){
  ['Produk','Penjualan','Pembelian','Pengeluaran'].forEach(k=>{ if(!Array.isArray(DB[k])) DB[k]=[]; });
  ['Penjualan','Pembelian'].forEach(k=>{ DB[k]=DB[k].map(x=>({...x,items:normItems(x.items),tgl:normTgl(x.tgl)})); });
  DB.Pengeluaran=DB.Pengeluaran.map(x=>({...x,tgl:normTgl(x.tgl)}));
}

function getAllowedMenu(){

function saveUsers(){localStorage.setItem('users',JSON.stringify(USERS))}
const isDirty=k=>localStorage.getItem('dirty_'+k)==='1';
const setDirty=(k,v)=>{try{v?localStorage.setItem('dirty_'+k,'1'):localStorage.removeItem('dirty_'+k)}catch(e){}};
async function syncUsers(force){
  saveUsers();
  if(!S.url) return;
  setDirty('Users',true);
  try{
    const j=await (await fetch(S.url,{method:'POST',body:JSON.stringify({sheet:'Users',rows:USERS,force:force===true})})).json();
    if(j.status==='ok'){setDirty('Users',false);localStorage.setItem('usersSynced','1');toast('User tersimpan ke Spreadsheet')}
    else toast('Sinkron user ditolak: '+(j.message||'periksa spreadsheet'));
  }catch(e){toast('Gagal sync user, tersimpan lokal')}
}
function saveDB(){localStorage.setItem('db',JSON.stringify(DB))}
function saveS(){localStorage.setItem('set',JSON.stringify(S));updateBrand()}

function getAllKategori(){
  const custom=S.kategoriTambahan||[];
  return [...new Set([...DEFAULT_KATEGORI,...custom])].sort();
}

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(window._t);window._t=setTimeout(()=>t.style.display='none',2400)}

async function sync(sh,force){
  saveDB();if(!S.url)return;
  setDirty(sh,true);
  try{
    const rows=(DB[sh]||[]).map(r=>Array.isArray(r.items)?{...r,items:JSON.stringify(r.items)}:r);
    const j=await (await fetch(S.url,{method:'POST',body:JSON.stringify({sheet:sh,rows,force:force===true})})).json();
    if(j.status==='ok'){setDirty(sh,false);toast('Tersimpan ke Spreadsheet')}
    else toast('Ditolak: data lokal tampak lebih sedikit dari spreadsheet. Tekan "Ambil data dari Spreadsheet".');
  }catch(e){toast('Gagal sinkron, data aman di perangkat')}
}
async function pull(silent){
  if(!S.url){ if(!silent) toast('Isi URL di Pengaturan'); return; }
  try{
    const r=await (await fetch(S.url)).json();
    Object.keys(DB).forEach(k=>{
      if(!Array.isArray(r[k])) return;
      if(silent && isDirty(k)) return;               // ada perubahan lokal yang belum terkirim
      if(r[k].length===0 && DB[k].length>0){ sync(k); return; } // sheet kosong, lokal ada isi: jangan dihapus
      DB[k]=r[k]; setDirty(k,false);
    });
    normDB(); saveDB();
    if(Array.isArray(r.Users) && r.Users.length && !(silent && isDirty('Users'))){
      USERS=r.Users.map(normUser); saveUsers(); localStorage.setItem('usersSynced','1');
    }
    if(!silent) toast('Data diambil dari Spreadsheet');
    if(cur && window.CURRENT) go(cur);
  }catch(e){ if(!silent) toast('Gagal mengambil data'); }
}
const normUser=u=>({...u,id:String(u.id),username:String(u.username),password:String(u.password),nama:String(u.nama||u.username),role:String(u.role||'kasir')});
async function refreshUsers(){
  if(!S.url) return false;
  if(isDirty('Users')) return false;
  try{
    const c=new AbortController(), t=setTimeout(()=>c.abort(),8000);
    const r=await (await fetch(S.url+'?sheet=Users',{signal:c.signal})).json();
    clearTimeout(t);
    if(Array.isArray(r.Users) && r.Users.length){
      USERS=r.Users.map(normUser); saveUsers(); localStorage.setItem('usersSynced','1'); return true;
    }
    return 'empty';
  }catch(e){ return false; }
}

function go(p){
  const allowed=getAllowedMenu().map(m=>m.id);
  if(!allowed.includes(p)) p=allowed[0]||'kasir';
  cur=p;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===p));
  const titles={dash:'Dashboard',kasir:'Kasir Penjualan',beli:'Pembelian Stok',stok:'Data Produk',biaya:'Pengeluaran',lap:'Laporan',set:'Pengaturan',users:'Manajemen Pengguna'};
  document.getElementById('pageTitle').textContent=titles[p]||'POS';
  document.getElementById('view').innerHTML=P[p]?P[p]():'';
  if(p==='kasir')renderKasir();
}

P.dash=()=>{
  const t=today(),bl=t.slice(0,7);
  const J=DB.Penjualan,ym=x=>x.tgl.slice(0,7)==bl;
  const omzet=sum(J.filter(ym),x=>x.total);
  const laba=sum(J.filter(ym),x=>sum(x.items,i=>(i.harga-i.modal)*i.qty)-x.diskon);
  const beli=sum(DB.Pembelian.filter(ym),x=>x.total);
  const biaya=sum(DB.Pengeluaran.filter(ym),x=>x.jumlah);
  const hari=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()-(6-i)*864e5).toISOString().slice(0,10);return{d:d.slice(5),v:sum(J.filter(x=>x.tgl==d),x=>x.total)}});
  const mx=Math.max(1,...hari.map(h=>h.v));
  const low=DB.Produk.filter(p=>p.stok<=p.min);
  return '<div class="stats">'+
    '<div class="stat"><div class="stat-top">Pendapatan Hari Ini <span class="stat-icon">↗</span></div><strong>'+R(sum(J.filter(x=>x.tgl==t),x=>x.total))+'</strong><small>● Hari ini</small></div>'+
    '<div class="stat"><div class="stat-top">Pendapatan Bulan Ini <span class="stat-icon">▤</span></div><strong>'+R(omzet)+'</strong><small>● Bulan berjalan</small></div>'+
    '<div class="stat"><div class="stat-top">Laba Bersih <span class="stat-icon">✓</span></div><strong>'+R(laba-biaya)+'</strong><small>● Setelah pengeluaran</small></div>'+
    '<div class="stat"><div class="stat-top">Pembelian Bulan Ini <span class="stat-icon">⇄</span></div><strong>'+R(beli)+'</strong><small>● Stok masuk</small></div>'+
  '</div>'+
  '<div class="layout" style="grid-template-columns:1.4fr 1fr">'+
    '<div class="card"><h3>Penjualan 7 Hari Terakhir</h3><div style="display:flex;gap:8px;align-items:flex-end;height:140px;margin-top:10px">'+hari.map(h=>'<div style="flex:1;text-align:center;font-size:11px;color:var(--muted)"><div style="height:'+(h.v/mx*120)+'px;background:var(--wood);border-radius:4px 4px 0 0;min-height:4px"></div>'+h.d+'</div>').join('')+'</div></div>'+
    '<div class="card"><h3>Stok Menipis ('+low.length+')</h3>'+(low.length?low.map(p=>'<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)"><span>'+E(p.nama)+'</span><span style="color:var(--red);font-weight:600">'+p.stok+'</span></div>').join(''):'<p style="color:var(--muted)">Semua stok aman.</p>')+'</div>'+
  '</div>';
};

function getCats(){return ['Semua',...new Set(DB.Produk.map(p=>p.kategori).filter(Boolean))]}
function emoji(p){const m={kursi:'🪑',meja:'🪵',lemari:'🚪',sofa:'🛋️','tempat tidur':'🛏️',kasur:'🛏️',rak:'📚','meja makan':'🪵','kursi makan':'🪑'};return m[(p.kategori||'').toLowerCase()]||'🪑'}

function renderKasir(){
  const q=Q.toLowerCase();
  let list=DB.Produk.filter(p=>(cat==='Semua'||p.kategori===cat)&&(p.nama+p.kode).toLowerCase().includes(q));
  const chips=getCats().map(c=>'<button class="chip '+(c===cat?'active':'')+'" onclick="setCat(\''+E(c)+'\')">'+E(c)+'</button>').join('');
  const prods=list.map(p=>'<article class="product" onclick="addCart(\''+p.id+'\')"><div class="product-art">'+(p.stok<=p.min?'<small>LOW</small>':'')+emoji(p)+'</div><div class="product-info"><h3>'+E(p.nama)+'</h3><p>'+E(p.kode||'-')+' · '+E(p.kategori||'')+'</p><div class="product-bottom"><div><div class="price">'+R(p.harga_jual)+'</div><div class="stock">Stok: '+p.stok+'</div></div><button class="add" type="button">+</button></div></div></article>').join('')||'<div class="empty">Belum ada produk. Tambahkan di menu Data Produk.</div>';
  const sub=sum(C,i=>i.qty*i.harga),disc=Math.min(sub,+K.diskon||0),tot=Math.max(sub-disc,0);
  const cartHtml=C.length?C.map((i,n)=>'<div class="cart-item"><div class="cart-thumb">'+emoji(i)+'</div><div><div class="item-name">'+E(i.nama)+'</div><div class="item-price">'+R(i.harga)+'</div><div class="qty"><button onclick="chgQty('+n+',-1)">−</button><span>'+i.qty+'</span><button onclick="chgQty('+n+',1)">+</button></div></div><div class="line-total">'+R(i.qty*i.harga)+'</div></div>').join(''):'<div class="empty">🛒<br>Keranjang masih kosong<br><small>Pilih produk untuk memulai transaksi</small></div>';
  document.getElementById('view').innerHTML=
  '<div class="layout"><section><div class="section-head"><h2>Pilih Produk</h2><span>'+list.length+' produk</span></div><div class="toolbar"><div class="search"><input placeholder="Cari nama atau kode..." value="'+E(Q)+'" oninput="Q=this.value;renderKasir()"></div></div><div class="chips">'+chips+'</div><div class="products">'+prods+'</div></section>'+
  '<aside class="cart"><div class="cart-head"><div><h2>Keranjang</h2><small>'+C.reduce((s,i)=>s+i.qty,0)+' item</small></div><button class="clear" onclick="clearCart()">Hapus semua</button></div>'+
  '<div class="customer"><label>NAMA PELANGGAN</label><input placeholder="Opsional" value="'+E(K.pelanggan)+'" onchange="K.pelanggan=this.value"></div>'+
  '<div class="cart-items">'+cartHtml+'</div><div class="summary"><div class="sum-row"><span>Subtotal</span><strong>'+R(sub)+'</strong></div>'+
  '<div class="discount-row"><input type="number" min="0" placeholder="Diskon (Rp)" value="'+(K.diskon||'')+'" onchange="K.diskon=+this.value;renderKasir()"></div>'+
  '<div class="sum-row"><span>Diskon</span><strong>'+R(disc)+'</strong></div><div class="sum-row total"><span>Total</span><strong>'+R(tot)+'</strong></div></div>'+
  '<div class="pay"><label>METODE PEMBAYARAN</label><select onchange="K.metode=this.value">'+['Tunai','Transfer','QRIS','Debit/Kredit'].map(m=>'<option '+(K.metode===m?'selected':'')+'>'+m+'</option>').join('')+'</select>'+
  '<div style="margin-bottom:10px"><input type="number" placeholder="Uang diterima" value="'+(K.bayar||'')+'" onchange="K.bayar=+this.value;renderKasir()" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px"></div>'+
  (K.bayar?'<div class="sum-row" style="margin-bottom:10px"><span>Kembalian</span><strong>'+R(Math.max(K.bayar-tot,0))+'</strong></div>':'')+
  '<button class="checkout" onclick="checkout()" '+(C.length?'':'disabled')+'>Proses Pembayaran →</button></div></aside></div>';
}
function setCat(c){cat=c;renderKasir()}
function addCart(id){const p=DB.Produk.find(x=>x.id===id);if(!p||p.stok<1)return toast('Stok habis');const ex=C.find(x=>x.id===id);if(ex){if(ex.qty>=p.stok)return toast('Melebihi stok');ex.qty++}else C.push({id,nama:p.nama,qty:1,harga:+p.harga_jual,modal:+p.harga_beli,kategori:p.kategori});renderKasir();toast(p.nama+' ditambahkan')}
function chgQty(n,d){const i=C[n];if(!i)return;const p=DB.Produk.find(x=>x.id===i.id);const next=i.qty+d;if(next<=0)C.splice(n,1);else if(next>p.stok)return toast('Melebihi stok');else i.qty=next;renderKasir()}
function clearCart(){C=[];K.diskon=0;renderKasir()}

function checkout(){
  if(!C.length)return;
  for(const i of C){const p=DB.Produk.find(x=>x.id===i.id);if(!p||p.stok<i.qty)return alert('Stok '+i.nama+' tidak cukup')}
  const sub=sum(C,i=>i.qty*i.harga),disc=+K.diskon||0,tot=Math.max(sub-disc,0);
  const t={id:uid(),no:'INV-'+today().replace(/-/g,'')+'-'+String(DB.Penjualan.filter(x=>x.tgl==today()).length+1).padStart(3,'0'),tgl:today(),pelanggan:K.pelanggan||'Umum',items:C.map(i=>({...i})),diskon:disc,total:tot,metode:K.metode,bayar:+K.bayar||tot};
  C.forEach(i=>{const p=DB.Produk.find(x=>x.id===i.id);if(p)p.stok-=i.qty});
  DB.Penjualan.push(t);sync('Penjualan');sync('Produk');
  lastReceipt=t;
  document.getElementById('receiptText').textContent=t.no+' · '+t.pelanggan+' · '+R(t.total);
  document.getElementById('modal').classList.add('show');
  C=[];K={pelanggan:'',diskon:0,metode:'Tunai',bayar:0};
  renderKasir();
}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function printReceipt(){if(!lastReceipt)return;const t=lastReceipt;const w=window.open('','_blank','width=360,height=650');if(!w)return toast('Izinkan pop-up');
  w.document.write('<html><head><title>'+t.no+'</title><style>body{font:13px monospace;width:72mm;margin:8px auto}h2,h3,p{margin:4px 0;text-align:center}table{width:100%}td:last-child{text-align:right}hr{border:0;border-top:1px dashed #000}</style></head><body><h2>'+E(S.nama)+'</h2><p>'+E(S.alamat)+'</p><p>'+E(S.telp)+'</p><hr>No: '+t.no+'<br>Tgl: '+t.tgl+'<br>Pel: '+E(t.pelanggan)+'<hr><table>'+t.items.map(i=>'<tr><td colspan=2>'+E(i.nama)+'</td></tr><tr><td>'+i.qty+' x '+Math.round(i.harga).toLocaleString('id-ID')+'</td><td>'+Math.round(i.qty*i.harga).toLocaleString('id-ID')+'</td></tr>').join('')+'</table><hr><table><tr><td>Diskon</td><td>'+Math.round(t.diskon).toLocaleString('id-ID')+'</td></tr><tr><td><b>Total</b></td><td><b>'+Math.round(t.total).toLocaleString('id-ID')+'</b></td></tr><tr><td>'+t.metode+'</td><td>'+Math.round(t.bayar).toLocaleString('id-ID')+'</td></tr><tr><td>Kembali</td><td>'+Math.round(Math.max(t.bayar-t.total,0)).toLocaleString('id-ID')+'</td></tr></table><hr><p>Terima kasih</p><script>onload=()=>print()<\/script></body></html>');w.document.close()}

P.beli=()=>'<div class="card"><h3>Pembelian dari Supplier</h3><div class="row"><input placeholder="Nama supplier" value="'+E(V.supplier)+'" onchange="V.supplier=this.value"><select onchange="addBeli(this.value)"><option value="">+ Tambah produk</option>'+DB.Produk.map(p=>'<option value="'+p.id+'">'+E(p.nama)+'</option>').join('')+'</select></div><div class="table-wrap"><table><tr><th>Produk<th>Jumlah<th>Harga Beli<th class="right">Subtotal<th></tr>'+B.map((i,n)=>'<tr><td>'+E(i.nama)+'<td><input type="number" value="'+i.qty+'" style="width:70px" onchange="B['+n+'].qty=+this.value;go(\'beli\')"><td><input type="number" value="'+i.harga+'" style="width:120px" onchange="B['+n+'].harga=+this.value;go(\'beli\')"><td class="right">'+R(i.qty*i.harga)+'<td><button class="btn x" onclick="B.splice('+n+',1);go(\'beli\')">Hapus</button></tr>').join('')+'</table></div><p style="margin:12px 0">Total <strong style="font-size:20px;color:#68482d">'+R(sum(B,i=>i.qty*i.harga))+'</strong></p><button class="btn" onclick="simpanBeli()">Simpan & Tambah Stok</button></div><div class="card"><h3>Riwayat Pembelian</h3><div class="table-wrap"><table>'+DB.Pembelian.slice().reverse().slice(0,20).map(x=>'<tr><td>'+x.tgl+'<td>'+E(x.supplier)+'<td>'+x.items.map(i=>E(i.nama)+' ×'+i.qty).join(', ')+'<td class="right">'+R(x.total)+'</tr>').join('')+'</table></div></div>';
function addBeli(id){if(!id)return;const p=DB.Produk.find(x=>x.id===id);if(!B.find(x=>x.id===id))B.push({id,nama:p.nama,qty:1,harga:+p.harga_beli});go('beli')}
function simpanBeli(){if(!B.length)return alert('Pilih produk');B.forEach(i=>{const p=DB.Produk.find(x=>x.id===i.id);if(p){p.stok=+p.stok+i.qty;p.harga_beli=i.harga}});DB.Pembelian.push({id:uid(),tgl:today(),supplier:V.supplier||'-',items:B.map(i=>({...i})),total:sum(B,i=>i.qty*i.harga)});sync('Pembelian');sync('Produk');B=[];V={supplier:''};toast('Stok bertambah');go('beli')}

function addProduk(){const g=i=>document.getElementById(i).value.trim();if(!g('pn'))return alert('Nama wajib');const kat=g('pc');if(kat && !getAllKategori().includes(kat)){S.kategoriTambahan=S.kategoriTambahan||[];if(!S.kategoriTambahan.includes(kat)){S.kategoriTambahan.push(kat);saveS()}}DB.Produk.push({id:uid(),kode:g('pk'),nama:g('pn'),kategori:kat,harga_beli:+g('pb')||0,harga_jual:+g('pj')||0,stok:+g('ps')||0,min:+g('pm')||0});sync('Produk');go('stok')}
function opname(id){const p=DB.Produk.find(x=>x.id===id);const v=prompt('Stok fisik "'+p.nama+'" (tercatat '+p.stok+'):',p.stok);if(v==null||v==='')return;p.stok=+v;sync('Produk');go('stok')}
function editP(id){const p=DB.Produk.find(x=>x.id===id);const n=prompt('Nama',p.nama),j=prompt('Harga jual',p.harga_jual),b=prompt('Harga beli',p.harga_beli);if(n)p.nama=n;if(j)p.harga_jual=+j;if(b)p.harga_beli=+b;sync('Produk');go('stok')}
function delP(id){if(confirm('Hapus produk ini?')){DB.Produk=DB.Produk.filter(x=>x.id!==id);sync('Produk');go('stok')}}

P.biaya=()=>'<div class="card"><div class="row"><input id="bk" placeholder="Keterangan"><input id="bj" type="number" placeholder="Jumlah (Rp)"><button class="btn" onclick="addBiaya()" style="flex:none">Simpan</button></div></div><div class="card"><div class="table-wrap"><table>'+DB.Pengeluaran.slice().reverse().map(x=>'<tr><td>'+x.tgl+'<td>'+E(x.ket)+'<td class="right">'+R(x.jumlah)+'<td><button class="btn x" onclick="delBiaya(\''+x.id+'\')">Hapus</button></tr>').join('')||'<tr><td style="color:var(--muted)">Belum ada pengeluaran.</td></tr>'+'</table></div></div>';
function addBiaya(){const j=+document.getElementById('bj').value;if(!j)return alert('Isi jumlah');DB.Pengeluaran.push({id:uid(),tgl:today(),ket:document.getElementById('bk').value,jumlah:j});sync('Pengeluaran');go('biaya')}
function delBiaya(id){DB.Pengeluaran=DB.Pengeluaran.filter(x=>x.id!==id);sync('Pengeluaran');go('biaya')}

P.lap=()=>{
  const f=x=>x.tgl>=D1&&x.tgl<=D2;
  const J=DB.Penjualan.filter(f);
  const om=sum(J,x=>x.total);
  const lk=sum(J,x=>sum(x.items,i=>(i.harga-i.modal)*i.qty)-x.diskon);
  const bx=sum(DB.Pengeluaran.filter(f),x=>x.jumlah);
  return '<div class="card"><div class="row"><input type="date" value="'+D1+'" onchange="D1=this.value;go(\'lap\')"><input type="date" value="'+D2+'" onchange="D2=this.value;go(\'lap\')"></div></div>'+
  '<div class="stats"><div class="stat"><div class="stat-top">Omzet</div><strong>'+R(om)+'</strong></div><div class="stat"><div class="stat-top">Laba Kotor</div><strong>'+R(lk)+'</strong></div><div class="stat"><div class="stat-top">Pengeluaran</div><strong>'+R(bx)+'</strong></div><div class="stat"><div class="stat-top">Laba Bersih</div><strong>'+R(lk-bx)+'</strong></div></div>'+
  '<div class="card"><h3>Transaksi Penjualan</h3><div class="table-wrap"><table><tr><th>No<th>Tanggal<th>Pelanggan<th>Metode<th class="right">Total<th></tr>'+
  J.slice().reverse().map(x=>'<tr><td>'+x.no+'<td>'+x.tgl+'<td>'+E(x.pelanggan)+'<td>'+x.metode+'<td class="right">'+R(x.total)+'<td><button class="btn o" onclick="reprint(\''+x.id+'\')">Cetak</button></tr>').join('')||'<tr><td colspan="6" style="color:var(--muted)">Tidak ada transaksi.</td></tr>'+
  '</table></div></div>';
};
function reprint(id){lastReceipt=DB.Penjualan.find(x=>x.id===id);if(lastReceipt)printReceipt()}

P.set=()=>'<div class="card"><h3>Profil Toko</h3><div style="display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap"><div><label style="font-size:10px;color:var(--muted)">LOGO TOKO</label><div class="logo-preview" id="logoPrev">'+(S.logo?'<img src="'+S.logo+'">':'<span style="color:var(--muted);font-size:12px">Belum ada logo</span>')+'</div><input type="file" accept="image/*" style="margin-top:8px;font-size:12px" onchange="uploadLogo(this)">'+(S.logo?'<button class="btn x" style="margin-top:6px" onclick="S.logo=\'\';saveS();go(\'set\')">Hapus Logo</button>':'')+'</div><div style="flex:1;min-width:250px"><div class="row"><input id="sn" placeholder="Nama toko" value="'+E(S.nama)+'"></div><div class="row"><input id="sa" placeholder="Alamat" value="'+E(S.alamat)+'"></div><div class="row"><input id="st" placeholder="Telepon / WhatsApp" value="'+E(S.telp||'')+'"></div><div class="row"><input id="ss" placeholder="Slogan / tagline" value="'+E(S.slogan||'')+'"></div></div></div><div class="row" style="margin-top:12px"><input id="su" placeholder="URL Web App Google Apps Script (opsional)" value="'+E(S.url)+'"'+(CFG.SCRIPT_URL?' readonly title="Diatur di config.js"':'')+'></div><div class="row"><button class="btn" onclick="simpanSet()">Simpan Pengaturan</button><button class="btn o" onclick="pull()">Ambil data dari Spreadsheet</button><button class="btn o" onclick="Object.keys(DB).forEach(k=>sync(k));syncUsers()">Kirim semua data</button></div><p style="color:var(--muted);font-size:12px;margin-top:10px">Tanpa URL, data hanya tersimpan di browser ini. Logo disimpan secara lokal (base64) atau URL.</p></div>';
function uploadLogo(input){const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{S.logo=r.result;saveS();go('set');toast('Logo diunggah')};r.readAsDataURL(f)}
function simpanSet(){S.nama=document.getElementById('sn').value.trim()||'Riyadh Meubel';S.alamat=document.getElementById('sa').value.trim();S.telp=document.getElementById('st').value.trim();S.slogan=document.getElementById('ss').value.trim();S.url=CFG.SCRIPT_URL||document.getElementById('su').value.trim();saveS();toast('Pengaturan tersimpan');if(S.url)pull()}

P.users=()=>{
  return '<div class="card"><h3>Tambah Pengguna</h3><div class="row"><input id="uu" placeholder="Username"><input id="up" type="password" placeholder="Password"><input id="un" placeholder="Nama"><select id="ur"><option value="kasir">Kasir</option><option value="gudang">Gudang</option><option value="pemilik">Pemilik</option></select></div><button class="btn" onclick="addUser()">Tambah Pengguna</button></div>'+
  '<div class="card"><h3>Daftar Pengguna</h3><div class="table-wrap"><table><tr><th>Username<th>Nama<th>Role<th></tr>'+
  USERS.map(u=>'<tr><td>'+E(u.username)+'<td>'+E(u.nama)+'<td>'+u.role+'<td>'+(u.username!=='pemilik'?'<button class="btn x" onclick="delUser(\''+u.id+'\')">Hapus</button>':'')+'</tr>').join('')+
  '</table></div><div class="row" style="margin-top:12px"><button class="btn o" onclick="resetUsers()">Reset Akun Default</button></div></div>';
};
function addUser(){
  const u=document.getElementById('uu').value.trim();
  const p=document.getElementById('up').value;
  const n=document.getElementById('un').value.trim()||u;
  const r=document.getElementById('ur').value;
  if(!u||!p)return alert('Username dan password wajib');
  if(USERS.find(x=>x.username===u))return alert('Username sudah ada');
  USERS.push({id:uid(),username:u,password:p,nama:n,role:r});
  syncUsers();
  toast('Pengguna ditambahkan');
  go('users');
}
function delUser(id){
  if(confirm('Hapus pengguna ini?')){
    USERS=USERS.filter(x=>x.id!==id);
    syncUsers();
    go('users');
  }
}

function resetUsers(){
  if(!window.CURRENT||window.CURRENT.role!=='pemilik') return alert('Hanya pemilik');
  if(confirm('Reset semua akun ke default (pemilik/kasir/gudang)? Password lama dihapus di semua perangkat.')){
    USERS=DEFAULT_USERS.slice(); saveUsers(); syncUsers(true); go('users');
  }
}
async function doLogin(){
  if(window._loggingIn) return;
  const u=(document.getElementById('loginUser').value||'').trim().toLowerCase();
  const p=document.getElementById('loginPass').value||'';
  const err=document.getElementById('loginError');
  const btn=document.getElementById('btnLogin');
  err.style.display='none';
  window._loggingIn=true;
  if(btn){btn.disabled=true;btn.textContent='Memeriksa...'}
  const state=await refreshUsers();           // true | 'empty' | false (offline / belum diatur)
  if(btn){btn.disabled=false;btn.textContent='Masuk'}
  window._loggingIn=false;
  const found=USERS.find(x=>x.username&&x.username.toLowerCase()===u&&x.password===p);
  if(!found){
    err.textContent=(state===false&&S.url)?'Username atau password salah (mode offline: memakai data tersimpan di perangkat)':'Username atau password salah';
    err.style.display='block';
    return;
  }
  const {password:_pw,...user}=found;
  CURRENT=user;
  try{ sessionStorage.setItem('currentUser',JSON.stringify(user)); }catch(e){}
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='grid';
  buildNav(); updateBrand();
  go(getAllowedMenu()[0]?.id||'kasir');
  toast('Selamat datang, '+user.nama);
  if(S.url){
    if(state==='empty') syncUsers();                       // sheet Users masih kosong: isi dengan akun ini
    Object.keys(DB).filter(isDirty).forEach(k=>sync(k));   // kirim dulu perubahan yang tertunda
    pull(true);                                            // lalu ambil data terbaru
  }
}

document.addEventListener('DOMContentLoaded', function(){
  const btn = document.getElementById('btnLogin');
  const pass = document.getElementById('loginPass');
  if(pass) pass.addEventListener('keypress', function(e){ if(e.key==='Enter') doLogin(); });
});
function logout(){
  window.CURRENT=null;
  sessionStorage.removeItem('currentUser');
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginUser').value='';
  document.getElementById('loginPass').value='';
  document.getElementById('loginError').style.display='none';
}


// ===== Backup & Restore =====
const daysSinceBackup=()=>{const t=localStorage.getItem('lastBackup');return t?Math.floor((Date.now()-new Date(t))/864e5):null};
function markBackup(){try{localStorage.setItem('lastBackup',new Date().toISOString())}catch(e){}}
function downloadBackup(){
  const payload={app:'riyadh-meubel-pos',version:1,tanggal:new Date().toISOString(),DB:DB,Users:USERS,Settings:{...S,url:''}};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='backup-riyadh-meubel-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
  markBackup();toast('Backup diunduh');if(cur==='set'||cur==='dash')go(cur);
}
function restoreBackup(input){
  const f=input.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(d.app!=='riyadh-meubel-pos'||!d.DB||typeof d.DB!=='object') throw new Error('format');
      const ringkas=['Produk','Penjualan','Pembelian','Pengeluaran'].map(k=>k+': '+((d.DB[k]||[]).length)).join('\n');
      if(!confirm('Pulihkan backup tanggal '+String(d.tanggal||'').slice(0,10)+'?\n\n'+ringkas+'\n\nData saat ini akan DIGANTI (salinan sebelumnya disimpan sementara di perangkat).')){input.value='';return}
      try{localStorage.setItem('db_prev',JSON.stringify(DB))}catch(e){}
      DB=d.DB;normDB();saveDB();
      if(Array.isArray(d.Users)&&d.Users.length){USERS=d.Users.map(normUser);saveUsers()}
      if(S.url){['Produk','Penjualan','Pembelian','Pengeluaran'].forEach(k=>sync(k,true));syncUsers(true)}
      toast('Backup dipulihkan');go('set');
    }catch(e){alert('File backup tidak valid')}
  };
  r.readAsText(f);
}
async function driveBackup(){
  if(!S.url) return toast('URL spreadsheet belum diatur');
  toast('Membuat backup di Google Drive...');
  try{
    const j=await (await fetch(S.url,{method:'POST',body:JSON.stringify({action:'backup'})})).json();
    if(j.status==='ok'){markBackup();toast('Backup Drive: '+j.file);if(cur==='set')go('set')}
    else toast('Gagal backup: '+(j.message||''));
  }catch(e){toast('Gagal menghubungi server')}
}
const backupCard=()=>{
  const d=daysSinceBackup();
  const info=d===null?'Belum pernah backup dari perangkat ini.':(d===0?'Backup terakhir: hari ini.':'Backup terakhir: '+d+' hari lalu.');
  return '<div class="card" style="margin-top:16px"><h3>Backup &amp; Restore</h3><p style="color:var(--muted);font-size:12px;margin:0 0 10px">'+info+' Spreadsheet juga disalin otomatis ke Google Drive setiap malam (jika trigger harian sudah dipasang).</p>'+
  '<div class="row"><button class="btn" onclick="downloadBackup()">Unduh Backup (.json)</button><button class="btn o" onclick="driveBackup()">Backup ke Google Drive sekarang</button></div>'+
  '<div style="margin-top:12px"><label style="font-size:11px;color:var(--muted)">PULIHKAN DARI FILE BACKUP</label><br><input type="file" accept=".json,application/json" style="margin-top:6px;font-size:12px" onchange="restoreBackup(this)"></div></div>';
};
const backupBanner=()=>{
  if(!window.CURRENT||window.CURRENT.role!=='pemilik') return '';
  const d=daysSinceBackup();
  if(d!==null&&d<7) return '';
  return '<div class="card" style="border-color:#e8b4b8;background:#fff5f5;margin-bottom:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><strong>⚠ '+(d===null?'Belum pernah backup.':'Sudah '+d+' hari belum backup.')+'</strong> Unduh salinan data agar aman.</span><button class="btn" onclick="downloadBackup()">Backup sekarang</button></div>';
};
{const _set0=P.set,_dash0=P.dash;P.set=()=>_set0()+backupCard();P.dash=()=>backupBanner()+_dash0();}

// Init
document.getElementById('todayChip').textContent='◷ '+new Date().toLocaleDateString('id-ID',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
if(window.CURRENT){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='grid';
  buildNav();
  updateBrand();
  const first=getAllowedMenu()[0]?.id||'kasir';
  go(first);
} else {
  document.getElementById('loginScreen').style.display='flex';
}

window.doLogin = doLogin;
</script>
